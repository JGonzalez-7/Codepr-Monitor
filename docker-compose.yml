services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: codepr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codepr}
      POSTGRES_DB: codepr_monitor
    volumes:
      - monitor-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepr -d codepr_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://codepr:${POSTGRES_PASSWORD:-codepr}@db:5432/codepr_monitor
      # No SECRETS.md here on purpose — nothing writes credentials into the
      # container. Set SEED_ADMIN_PASSWORD and SEED_USER_PASSWORD in .env so you
      # already know the seeded passwords when running this stack.
    ports:
      - "8090:8000"   # CodePR-Monitor -> http://localhost:8090
    restart: unless-stopped

  # Deeper monitoring surface, embedded into the admin dashboard.
  # First run: open http://localhost:3001 and create the Kuma admin account.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  monitor-db-data:
  uptime-kuma-data:
