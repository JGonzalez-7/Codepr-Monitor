services:
  app:
    build: .
    env_file:
      - .env
    environment:
      # SQLite, on the named volume below. Four slashes: sqlite://// means an
      # absolute path. Nothing else in the app is database-specific, so pointing
      # this at postgresql+psycopg://... is all it takes to move back.
      DATABASE_URL: sqlite:////srv/data/codepr_monitor.db
      # No SECRETS.md here on purpose — nothing writes credentials into the
      # container. Set SEED_ADMIN_PASSWORD and SEED_USER_PASSWORD in .env so you
      # already know the seeded passwords when running this stack.
    volumes:
      # The database file lives here. Without this mount it would sit in the
      # container filesystem and be destroyed by the next image rebuild.
      - monitor-sqlite-data:/srv/data
    ports:
      - "8090:8000"   # CodePR-Monitor -> http://localhost:8090
    restart: unless-stopped

  # Deeper monitoring surface, embedded into the admin dashboard.
  # First run: open http://localhost:3001 and create the Kuma admin account.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  monitor-sqlite-data:
  uptime-kuma-data:
